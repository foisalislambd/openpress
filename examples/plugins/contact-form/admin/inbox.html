<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Inbox</title>
    <style>
      body { font: 14px/1.4 sans-serif; margin: 16px; color: #1d2327; }
      button { padding: 6px 10px; }
      li { margin: 6px 0; }
    </style>
  </head>
  <body>
    <h1>Inbox</h1>
    <button id="load" type="button">Refresh entries</button>
    <ul id="rows"></ul>
    <script>
      document.getElementById('load').addEventListener('click', function () {
        window.openpress.call('GET', '/entries').then(function (data) {
          var list = document.getElementById('rows');
          list.textContent = '';
          var items = data && data.items ? data.items : [];
          items.forEach(function (row) {
            var li = document.createElement('li');
            var fields = row.data || {};
            li.textContent = fields.name + ' <' + fields.email + '>';
            list.appendChild(li);
          });
        }).catch(function (error) {
          document.getElementById('rows').textContent = error.message;
        });
      });
    </script>
  </body>
</html>
